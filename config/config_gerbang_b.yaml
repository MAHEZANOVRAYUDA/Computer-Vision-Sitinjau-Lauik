# =====================================================================
# KONFIGURASI GERBANG B — Sitinjau Lauik
# Jembatan Timbang Oto (Titik Keluar ke Solok / Arah Kabupaten)
# =====================================================================
# File ini SIAP PAKAI saat kamera Gerbang B sudah terpasang secara fisik.
# Cara menjalankan:
#     python src/main.py config/config_gerbang_b.yaml
#
# Status saat ini: BELUM AKTIF — kamera fisik belum terpasang.
# Saat aktif nanti, mqtt_consumer.py akan otomatis menerima data dari
# node ini dan beralih ke mode occupancy "flow_in_minus_out" yang lebih akurat.
# =====================================================================

# ---------------------------------------------------------------------
# 1. SUMBER VIDEO — Gerbang B
# ---------------------------------------------------------------------
video_source:
  # Mode: "file" untuk demo/testing, "rtsp" saat kamera fisik terpasang
  mode: "file"

  # Isi dengan URL RTSP kamera Gerbang B saat sudah ada
  rtsp_url: "${GERBANG_B_RTSP_URL}"

  # File video simulasi untuk testing Gerbang B
  file_path: "data/videos/test3.mp4"

  process_width: 640
  process_height: 360

# ---------------------------------------------------------------------
# 2. IDENTITAS GERBANG B
# ---------------------------------------------------------------------
gerbang:
  id: "gerbang_b"
  nama: "Gerbang B - Jembatan Timbang Oto"
  # Kamera menghadap ke arah Solok:
  #   - Kendaraan menjauhi kamera = MASUK ke ruas (dari Solok ke Padang)
  #   - Kendaraan mendekati kamera = KELUAR dari ruas (sudah melewati 16.5 km)
  menghadap: "ke_solok"

# ---------------------------------------------------------------------
# 2b. DAFTAR KAMERA AKTIF — Gerbang B
# ---------------------------------------------------------------------
kamera:
  - id: "gerbang_a"
    gerbang: "A"
    aktif: false
    stream_port: 9001
    rtsp_url: null
    counting_lines: []
  - id: "gerbang_b"
    gerbang: "B"
    aktif: true
    source_type: "file"           # "file" untuk demo, "rtsp" saat kamera fisik
    source: "data/videos/test3.mp4"
    stream_port: 9002
    rtsp_url: "${GERBANG_B_RTSP_URL}"
    counting_lines:
      - id: "lajur_kiri"
        arah: "masuk"
        garis:
          titik_1: [100, 270]
          titik_2: [300, 270]
        toleransi_piksel: 8
        pixel_per_meter: 25.0
      - id: "lajur_kanan"
        arah: "keluar"
        garis:
          titik_1: [340, 270]
          titik_2: [540, 270]
        toleransi_piksel: 8
        pixel_per_meter: 25.0

# ---------------------------------------------------------------------
# 3. VIRTUAL COUNTING LINE — Gerbang B
# ---------------------------------------------------------------------
# WAJIB KALIBRASI ULANG setelah kamera terpasang fisik di Gerbang B.
# Nilai di bawah adalah PLACEHOLDER — tidak valid sebelum dikalibrasi.
# Jalankan: python scripts/kalibrasi_garis.py config/config_gerbang_b.yaml
# (Catatan: konfigurasi counting_lines dipindahkan ke dalam blok 'kamera' di v2)

# ---------------------------------------------------------------------
# 4. MODEL DETEKSI (YOLO) — sama di semua node
# ---------------------------------------------------------------------
model:
  weights_path: "models/yolov8n.pt"   # Nano: optimal untuk CPU (bukan yolov8s)
  inference_size: 320                  # 320 jauh lebih cepat dari default 416 di CPU
  confidence_threshold: 0.30
  iou_threshold: 0.45
  device: "cpu"
  half_precision: false               # Tidak ada manfaat di CPU

  coco_class_mapping:
    2: "mobil"
    3: "motor"
    5: "bus"
    7: "truk"

# ---------------------------------------------------------------------
# 5. TRACKER (ByteTrack)
# ---------------------------------------------------------------------
tracker:
  type: "bytetrack.yaml"
  track_buffer: 30

# ---------------------------------------------------------------------
# 6. PANJANG KENDARAAN (METER)
# ---------------------------------------------------------------------
panjang_kendaraan:
  motor: 2.5
  mobil: 6.0
  bus: 14.0
  truk: 12.0

# ---------------------------------------------------------------------
# 7. DATA RUAS JALAN
# ---------------------------------------------------------------------
ruas_jalan:
  panjang_meter: 16500
  pct_segmen_sempit: 0.65
  pct_segmen_lebar: 0.35
  kapasitas_lateral_sempit: 2
  kapasitas_lateral_lebar: 6
  kecepatan_referensi_kmh: 42.0
  lhr_estimasi_harian: 9000
  radius_tikungan_sempit_m: 15.5

# ---------------------------------------------------------------------
# 8. SISTEM PAKAR
# ---------------------------------------------------------------------
sistem_pakar:
  kapasitas_meter_lajur: 56100
  ambang_lancar: 50.0
  ambang_padat: 75.0
  ambang_kecepatan_lambat_kmh: 0.0
  window_estimasi_menit: 30

# ---------------------------------------------------------------------
# 9. INTERVAL AGREGASI & MQTT — Gerbang B
# ---------------------------------------------------------------------
agregasi:
  interval_detik: 30

mqtt:
  broker_host: "sitinjau_mqtt"     # Gunakan nama service Docker
  broker_port: 1883
  topic_prefix: "sitinjau_lauik"
  client_id: "gerbang_b_edge"      # WAJIB BERBEDA dari Gerbang A

# ---------------------------------------------------------------------
# 10. DATABASE
# ---------------------------------------------------------------------
database:
  host: "${DB_HOST}"
  port: 5432
  name: "${DB_NAME}"
  user: "${DB_USER}"
  password: "${DB_PASSWORD}"

# ---------------------------------------------------------------------
# 11. TAMPILAN / DEBUG — Gerbang B
# ---------------------------------------------------------------------
tampilan:
  tampilkan_window: false
  tampilkan_garis_virtual: true
  simpan_video_output: false
  path_video_output: "data/logs/output_gerbang_b.mp4"
  stream_port: 9002                   # Port MJPEG streaming Gerbang B (berbeda dari A)

# ---------------------------------------------------------------------
# 12. LOGGING — Gerbang B (log terpisah per gerbang)
# ---------------------------------------------------------------------
logging:
  level: "INFO"
  file_path: "data/logs/gerbang_b.log"

# ---------------------------------------------------------------------
# 13. MKJI 1997 — parameter kapasitas standar (metrik UTAMA untuk laporan
# resmi/publikasi, menggantikan meter-lajur sebagai output utama)
# ---------------------------------------------------------------------
mkji:
  medan: "gunung"              # gradien 8-12% -> kategori MKJI "gunung"
  fc_w: 0.90                   # faktor lebar jalur, WAJIB divalidasi lapangan
  fc_sp: 1.00                  # tak terbagi, tanpa median
  fc_sf: 1.00                  # hambatan samping rendah (jalan luar kota)
  fc_cs: 1.00                  # jalan rural
  emp:
    motor: 0.4
    mobil: 1.0
    bus: 3.25                  # titik tengah rentang MKJI gunung 3.0-3.5, VALIDASI LAPANGAN
    truk: 5.0                  # titik tengah rentang MKJI gunung 4.0-6.0, VALIDASI LAPANGAN
  ambang_lancar_vc: 0.54
  ambang_padat_vc: 0.90
