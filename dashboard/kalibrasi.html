<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kalibrasi Garis — Sitinjau Lauik</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Inter:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
<style>
  .form-group {
      margin-bottom: 1rem;
  }
  .form-group label {
      display: block;
      margin-bottom: 0.5rem;
      font-size: 0.9rem;
      color: var(--text-secondary);
  }
  .form-control {
      width: 100%;
      padding: 0.75rem;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      background: rgba(0,0,0,0.2);
      color: #fff;
      font-family: monospace;
  }
  
  .btn {
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
  }
  .btn-primary {
      background: var(--lancar);
      color: #fff;
  }
  .btn-danger {
      background: var(--macet);
      color: #fff;
  }
  
  .line-group {
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
  }
  .coords-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
  }
  
  .alert {
      padding: 1rem;
      border-radius: 8px;
      margin-bottom: 1rem;
      display: none;
  }
  .alert-success { background: rgba(16, 185, 129, 0.2); border: 1px solid var(--lancar); }
  .alert-error { background: rgba(239, 68, 68, 0.2); border: 1px solid var(--macet); }
</style>
</head>
<body>

<div class="header">
    <a href="index.html" class="btn-back">← Kembali ke Dashboard</a>
    <h2 style="margin: 0;">Kalibrasi Garis Virtual</h2>
</div>

<div class="glass-panel" style="max-width: 800px; margin: 0 auto;">
    <div id="alert-box" class="alert"></div>
    
    <div class="form-group">
        <label>Pilih Gerbang</label>
        <select id="gerbang-select" class="form-control" style="background: var(--glass-bg);">
            <option value="gerbang_a">Gerbang A (Padang Basi)</option>
            <option value="gerbang_b">Gerbang B (Jembatan Timbang)</option>
        </select>
    </div>
    
    <div class="form-group">
        <label>API Key (Dibutuhkan untuk menyimpan/reset)</label>
        <input type="password" id="api-key" class="form-control" placeholder="Masukkan API Key">
    </div>
    
    <hr style="border-color: rgba(255,255,255,0.1); margin: 2rem 0;">
    
    <div id="lines-container">
        <!-- Diisi dinamis -->
        <div style="text-align: center; color: var(--text-tertiary);">Memuat data kalibrasi...</div>
    </div>
    
    <div style="display: flex; gap: 1rem; margin-top: 2rem;">
        <button id="btn-save" class="btn btn-primary" style="flex: 1;">Simpan Konfigurasi</button>
        <button id="btn-reset" class="btn btn-danger">Reset Counter</button>
    </div>
</div>

<script>
    let currentLines = [];
    
    document.addEventListener("DOMContentLoaded", () => {
        const select = document.getElementById("gerbang-select");
        select.addEventListener("change", () => loadKalibrasi(select.value));
        
        document.getElementById("btn-save").addEventListener("click", saveKalibrasi);
        document.getElementById("btn-reset").addEventListener("click", resetCounter);
        
        // Initial load
        loadKalibrasi(select.value);
    });
    
    function showAlert(msg, type="success") {
        const alertBox = document.getElementById("alert-box");
        alertBox.textContent = msg;
        alertBox.className = `alert alert-${type}`;
        alertBox.style.display = "block";
        setTimeout(() => { alertBox.style.display = "none"; }, 5000);
    }
    
    async function loadKalibrasi(gerbangId) {
        const container = document.getElementById("lines-container");
        container.innerHTML = `<div style="text-align: center; color: var(--text-tertiary);">Memuat...</div>`;
        try {
            const res = await fetch(`${API_BASE}/api/kalibrasi/${gerbangId}`);
            if(!res.ok) throw new Error("Gagal mengambil data");
            const json = await res.json();
            currentLines = json.lines || [];
            renderLines(currentLines);
        } catch(e) {
            container.innerHTML = `<div style="color: var(--macet); text-align: center;">Error: ${e.message}</div>`;
        }
    }
    
    function renderLines(lines) {
        const container = document.getElementById("lines-container");
        container.innerHTML = "";
        
        if (lines.length === 0) {
            container.innerHTML = `<div style="color: var(--text-tertiary); text-align: center;">Tidak ada garis terkonfigurasi.</div>`;
            return;
        }
        
        lines.forEach((line, idx) => {
            const t1 = line.garis.titik_1;
            const t2 = line.garis.titik_2;
            container.innerHTML += `
                <div class="line-group" data-id="${line.id}">
                    <h3 style="margin-top: 0;">Garis: ${line.id} <span style="font-size: 0.8rem; font-weight: normal; color: var(--text-secondary);">(${line.arah})</span></h3>
                    <div class="coords-grid">
                        <div>
                            <label style="color: var(--text-secondary); font-size: 0.85rem;">Titik 1 (X, Y)</label>
                            <div style="display:flex; gap:0.5rem;">
                                <input type="number" class="form-control x1" value="${t1[0]}">
                                <input type="number" class="form-control y1" value="${t1[1]}">
                            </div>
                        </div>
                        <div>
                            <label style="color: var(--text-secondary); font-size: 0.85rem;">Titik 2 (X, Y)</label>
                            <div style="display:flex; gap:0.5rem;">
                                <input type="number" class="form-control x2" value="${t2[0]}">
                                <input type="number" class="form-control y2" value="${t2[1]}">
                            </div>
                        </div>
                    </div>
                </div>
            `;
        });
    }
    
    async function saveKalibrasi() {
        const gerbangId = document.getElementById("gerbang-select").value;
        const apiKey = document.getElementById("api-key").value;
        
        const lineGroups = document.querySelectorAll(".line-group");
        const newLines = [];
        lineGroups.forEach(group => {
            const id = group.getAttribute("data-id");
            const x1 = parseInt(group.querySelector(".x1").value);
            const y1 = parseInt(group.querySelector(".y1").value);
            const x2 = parseInt(group.querySelector(".x2").value);
            const y2 = parseInt(group.querySelector(".y2").value);
            newLines.push({
                id: id,
                garis: { titik_1: [x1, y1], titik_2: [x2, y2] }
            });
        });
        
        try {
            const res = await fetch(`${API_BASE}/api/kalibrasi/${gerbangId}`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-API-Key': apiKey
                },
                body: JSON.stringify({ lines: newLines })
            });
            const json = await res.json();
            if(!res.ok) throw new Error(json.detail || "Gagal menyimpan kalibrasi");
            showAlert("Berhasil: " + json.message, "success");
        } catch(e) {
            showAlert("Error: " + e.message, "error");
        }
    }
    
    async function resetCounter() {
        if(!confirm("Anda yakin ingin mereset counter untuk gerbang ini?")) return;
        
        const gerbangId = document.getElementById("gerbang-select").value;
        const apiKey = document.getElementById("api-key").value;
        
        try {
            const res = await fetch(`${API_BASE}/api/kalibrasi/${gerbangId}/reset-counter`, {
                method: 'POST',
                headers: { 'X-API-Key': apiKey }
            });
            const json = await res.json();
            if(!res.ok) throw new Error(json.detail || "Gagal mereset counter");
            showAlert(json.message, "success");
        } catch(e) {
            showAlert("Error: " + e.message, "error");
        }
    }
</script>
</body>
</html>
