<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login Admin — Sitinjau Lauik</title>
<link href="https://cdnjs.cloudflare.com/ajax/libs/normalize/8.0.1/normalize.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<script src="shared.js"></script>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 1rem;
    }
    
    .login-container {
        width: 100%;
        max-width: 420px;
        position: relative;
    }
    
    /* Clean background for flat dark theme, no blur effects */
    
    .login-header {
        text-align: center;
        margin-bottom: 2rem;
    }
    
    .login-header h1 {
        font-family: var(--font-display);
        font-size: 2rem;
        font-weight: 800;
        margin: 0;
        margin-bottom: 0.5rem;
        color: var(--pupr-yellow);
    }
    
    .login-header p {
        color: var(--text-secondary);
        font-size: 0.95rem;
        margin: 0;
    }
    
    .alert {
        padding: 1rem;
        border-radius: 10px;
        margin-bottom: 1.5rem;
        font-size: 0.9rem;
        font-weight: 500;
        display: none;
    }
    
    .alert-error {
        background: rgba(220, 38, 38, 0.1);
        border: 1px solid var(--macet);
        color: var(--macet);
    }
</style>
</head>
<body>

<div class="login-container animate-fade-in">
    <div class="glass-panel" style="margin-bottom: 0;">
        <div class="login-header">
            <h1>Sitinjau Lauik</h1>
            <p>Admin Dashboard Login</p>
        </div>
        
        <div id="error-alert" class="alert alert-error"></div>
        
        <form id="login-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" class="form-control" required autocomplete="username" placeholder="Masukkan username">
            </div>
            
            <div class="form-group" style="margin-bottom: 2rem;">
                <label for="password">Password</label>
                <input type="password" id="password" class="form-control" required autocomplete="current-password" placeholder="Masukkan password">
            </div>
            
            <button type="submit" class="btn btn-primary" id="btn-submit">
                Masuk ke Dashboard
            </button>
            <div style="text-align: center; margin-top: 1rem;">
                <a href="index.html" style="color: var(--text-secondary); text-decoration: none; font-size: 0.85rem; font-weight: 500; transition: color 0.2s;">&larr; Kembali ke halaman utama</a>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        // If already logged in, redirect to admin
        if (getAuthToken()) {
            window.location.href = 'admin.html';
        }
        
        const form = document.getElementById('login-form');
        const errorAlert = document.getElementById('error-alert');
        const btnSubmit = document.getElementById('btn-submit');
        
        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            errorAlert.style.display = 'none';
            btnSubmit.disabled = true;
            btnSubmit.textContent = 'Memverifikasi...';
            
            try {
                const response = await fetch(`${API_BASE}/api/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });
                
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.detail || "Gagal melakukan login.");
                }
                
                if (data.status === "success" && data.token) {
                    setAuthToken(data.token);
                    // Redirect to previous page if needed, or admin
                    window.location.href = 'admin.html';
                } else {
                    throw new Error("Token tidak valid.");
                }
            } catch (err) {
                errorAlert.textContent = err.message;
                errorAlert.style.display = 'block';
                btnSubmit.disabled = false;
                btnSubmit.textContent = 'Masuk ke Dashboard';
            }
        });
    });
</script>

</body>
</html>
