version: '3.8'

services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sitinjau_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log
    networks:
      - sitinjau_net

  api:
    build: .
    container_name: sitinjau_api
    restart: unless-stopped
    command: python src/api_server.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./dashboard:/app/dashboard
      - ./data:/app/data
      - ./src:/app/src
    networks:
      - sitinjau_net

  consumer:
    build: .
    container_name: sitinjau_consumer
    restart: unless-stopped
    depends_on:
      - mosquitto
    command: python src/mqtt_consumer.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./src:/app/src
    networks:
      - sitinjau_net

  edge_a:
    build: .
    container_name: sitinjau_edge_a
    restart: unless-stopped
    depends_on:
      - mosquitto
    command: python src/main.py --config config/config_gerbang_a.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "9001:9001"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    networks:
      - sitinjau_net

  edge_b:
    build: .
    container_name: sitinjau_edge_b
    restart: unless-stopped
    depends_on:
      - mosquitto
    command: python src/main.py --config config/config_gerbang_b.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "9002:9002"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    networks:
      - sitinjau_net

networks:
  sitinjau_net:
    driver: bridge
