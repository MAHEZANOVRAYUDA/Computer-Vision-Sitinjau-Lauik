services:
  mosquitto:
    image: eclipse-mosquitto:2
    container_name: sitinjau_mqtt
    restart: unless-stopped
    ports:
      - "1883:1883"
    volumes:
      - ./config/mosquitto.conf:/mosquitto/config/mosquitto.conf
      - mosquitto_data:/mosquitto/data
      - mosquitto_log:/mosquitto/log
    networks:
      - sitinjau_net
    healthcheck:
      test: ["CMD", "mosquitto_pub", "-h", "localhost", "-t", "health", "-m", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  api:
    build: .
    container_name: sitinjau_api
    restart: unless-stopped
    command: python src/api_server.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "8000:8000"
    volumes:
      - ./config:/app/config
      - ./dashboard:/app/dashboard
      - ./data:/app/data
      - ./src:/app/src
    networks:
      - sitinjau_net
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  consumer:
    build: .
    container_name: sitinjau_consumer
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    command: python src/mqtt_consumer.py
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./src:/app/src
    networks:
      - sitinjau_net

  edge_a:
    build: .
    container_name: sitinjau_edge_a
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    command: python src/main.py --config config/config_gerbang_a.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "9001:9001"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    networks:
      - sitinjau_net

  edge_b:
    build: .
    container_name: sitinjau_edge_b
    restart: unless-stopped
    depends_on:
      mosquitto:
        condition: service_healthy
    command: python src/main.py --config config/config_gerbang_b.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    env_file:
      - .env
    ports:
      - "9002:9002"
    volumes:
      - ./config:/app/config
      - ./data:/app/data
      - ./models:/app/models
      - ./src:/app/src
    networks:
      - sitinjau_net

volumes:
  mosquitto_data:
  mosquitto_log:

networks:
  sitinjau_net:
    driver: bridge
